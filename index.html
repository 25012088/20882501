).join('');

// ===== 下拉选项生成 =====
const options = {};
FILTER_FIELDS.forEach(([field, selId]) => {
  const set = new Set();
  allData.forEach(r => set.add(r[field] || UNKNOWN));
  const list = [...set].sort((a, b) => {
    if (a === UNKNOWN) return 1;
    if (b === UNKNOWN) return -1;
    return a.localeCompare(b, 'zh-Hans-CN');
  });
  options[field] = ['全部'].concat(list);
  const sel = document.getElementById(selId);
  sel.innerHTML = options[field].map(v => '<option>' + v + '</option>').join('');
  sel.addEventListener('change', () => sel.classList.toggle('filter-active', sel.selectedIndex > 0));
});

// ===== 搜索 =====
function esc(s) {
  return String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
}
function formatCard(r) {
  return FIELDS.map(f => {
    const v = String(r[f] || '').trim();
    return { label: f, value: v === '' ? UNKNOWN : v, missing: v === '' };
  });
}
function doSearch() {
  const kw = document.getElementById('kw').value.trim();
  const chips = {};
  FILTER_FIELDS.forEach(([field, selId]) => {
    const v = document.getElementById(selId).value;
    chips[field] = (v === '全部') ? '' : v;
  });

  let rows = allData.filter(r =>
    FILTER_FIELDS.every(([f]) => !chips[f] || (r[f] || UNKNOWN) === chips[f])
  );
  if (kw) {
    const kwLower = kw.toLowerCase();
    // 关键词仅在这5个字段中模糊匹配：姓名/选调地点/专业/学历/准考证号
    rows = rows.filter(r =>
      SEARCH_FIELDS.some(f => {
        const v = String(r[f] || '').trim();
        return v !== '' && v.toLowerCase().indexOf(kwLower) !== -1;
      })
    );
  }

  // 完全一致的记录只保留一张卡片
  const seen = new Set();
  const uniqueRows = [];
  rows.forEach(r => {
    const key = FIELDS.map(f => r[f] || '').join('\u0001');
    if (!seen.has(key)) { seen.add(key); uniqueRows.push(r); }
  });

  // 按学院分组，“未知”排最后
  const groupMap = new Map();
  uniqueRows.forEach(r => {
    const college = r['学院'] || UNKNOWN;
    if (!groupMap.has(college)) groupMap.set(college, []);
    groupMap.get(college).push(formatCard(r));
  });
  const colleges = [...groupMap.keys()].sort((a, b) => {
    if (a === UNKNOWN) return 1;
    if (b === UNKNOWN) return -1;
    return a.localeCompare(b, 'zh-Hans-CN');
  });

  let html = '';
  colleges.forEach(college => {
    const cards = groupMap.get(college);
    html += '<div class="group"><div class="group-header"><span class="group-name">学院：' +
      esc(college) + '</span><span class="group-count">' + cards.length + ' 人</span></div>';
    html += cards.map(card =>
      '<div class="card"><div class="card-name' + (card[0].missing ? ' text-muted' : '') + '">' +
      esc(card[0].value) + '</div>' +
      card.slice(1).map(f =>
        '<div class="field-row"><span class="field-label">' + esc(f.label) +
        '</span><span class="field-value' + (f.missing ? ' text-muted' : '') + '">' +
        esc(f.value) + '</span></div>'
      ).join('') + '</div>'
    ).join('');
    html += '</div>';
  });

  document.getElementById('groupList').innerHTML = html;
  document.getElementById('resultCount').textContent = '共找到 ' + uniqueRows.length + ' 名选调生';
  document.getElementById('guessBanner').classList.toggle('hidden', !kw);
  document.getElementById('emptyBox').classList.toggle('hidden', uniqueRows.length > 0);
  document.getElementById('resultArea').classList.remove('hidden');
  document.getElementById('homeArea').classList.add('hidden');
}
function reset() {
  document.getElementById('kw').value = '';
  document.getElementById('clearKw').classList.add('hidden');
  FILTER_FIELDS.forEach(([field, selId]) => {
    const sel = document.getElementById(selId);
    sel.selectedIndex = 0;
    sel.classList.remove('filter-active');
  });
  document.getElementById('resultArea').classList.add('hidden');
  document.getElementById('homeArea').classList.remove('hidden');
}
document.getElementById('btnSearch').addEventListener('click', doSearch);
document.getElementById('kw').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
document.getElementById('kw').addEventListener('input', e =>
  document.getElementById('clearKw').classList.toggle('hidden', !e.target.value));
document.getElementById('clearKw').addEventListener('click', () => {
  document.getElementById('kw').value = '';
  document.getElementById('clearKw').classList.add('hidden');
});
document.getElementById('btnReset').addEventListener('click', reset);
</script>
</body>
</html>
